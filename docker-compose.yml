# AITestAgent 项目编排：MySQL + 后端 + 前端
# 使用方法：docker compose up -d --build
name: aitest-agent

services:
  mysql:
    image: mysql:8.0
    container_name: aitest-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aitest_agent}
      MYSQL_USER: ${MYSQL_USER:-aitest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aitest123456}
    ports:
      # 宿主机端口默认 3307，避免与本机已安装的 MySQL 冲突；可通过 MYSQL_PORT 覆盖
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动执行数据库初始化脚本
      - ./docs/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: aitest-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DEBUG: "false"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-aitest}:${MYSQL_PASSWORD:-aitest123456}@mysql:3306/${MYSQL_DATABASE:-aitest_agent}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      CORS_ORIGINS: '["http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: aitest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
